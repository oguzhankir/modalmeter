[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "modalmeter"
dynamic = ["version"]
description = "Foundations for evidence-based multimodal input and serving inspection"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "pydantic>=2.12,<3",
  "rich>=14.2,<15",
  "typer>=0.21,<0.22",
]

[project.optional-dependencies]
inspect = [
  "transformers==4.57.6",
  "torch==2.9.1",
  "torchvision==0.24.1",
  "pillow==12.0.0",
  "av==16.1.0",
]

[project.scripts]
modalmeter = "modalmeter.cli:app"

[project.urls]
Repository = "https://github.com/oguzhankir/modalmeter"
Issues = "https://github.com/oguzhankir/modalmeter/issues"

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14,<0.15", "mypy>=1.19,<1.20"]

[tool.hatch.version]
path = "src/modalmeter/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/modalmeter"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts/package_smoke.py", "/pyproject.toml", "/uv.lock", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not processor and not live'"
markers = [
  "processor: cached real processor integration (introduced in M1/M2)",
  "live: explicitly configured live backend/GPU validation (introduced in M4)",
]

[tool.uv]
required-version = ">=0.11.7,<0.12"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
